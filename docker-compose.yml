# Local MockBank with its own Postgres, so demos don't depend on Render waking up and the
# locking tests run on the same database engine as production.
#
#   docker compose up --build                 # app on http://localhost:8000
#   docker compose exec app python -m app.mockbank.cli create-client --name paymentsapp-dev --owner <customer_id>
#   TEST_DATABASE_URL=postgresql+psycopg://mockbank:mockbank@localhost:5433/mockbank_test uv run pytest
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mockbank
      POSTGRES_PASSWORD: mockbank
      POSTGRES_DB: mockbank
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockbank -d mockbank"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mockbank:mockbank@db:5432/mockbank
      COOKIE_SECURE: "false"   # plain http on localhost
      SANDBOX_TRIGGERS: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
