services:
  - type: web
    name: mockbankforpayments
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: BANK_API_KEY
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
