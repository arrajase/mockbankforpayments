services:
  - type: web
    name: mockbankforpayments
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://mockbankforpayments.onrender.com
      - key: SANDBOX_TRIGGERS
        value: "false"
