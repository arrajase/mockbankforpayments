<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockBank | Sign Up</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="navbar">
    <div class="logo">Mock<span>Bank</span></div>
</div>

<div class="page">
    <div class="card">
        <h1>Create your account</h1>
        <p class="subtitle">Sign up for MockBank net banking</p>

        <div id="message" class="message"></div>

        <form id="signup-form">
            <div class="field">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="field">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="field">
                <label for="login_id">Login ID</label>
                <input type="text" id="login_id" name="login_id" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">SUBMIT</button>
        </form>

        <a href="/" class="back-link">Already have an account? Login</a>
    </div>
</div>

<script src="/static/js/signup.js"></script>
</body>
</html>
