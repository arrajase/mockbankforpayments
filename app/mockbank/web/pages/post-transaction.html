<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockBank | Post Transaction</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="navbar">
    <div class="logo">Mock<span>Bank</span></div>
    <div class="nav-right">
        <span id="greeting"></span>
        <button id="logout-btn" class="link-btn">Logout</button>
    </div>
</div>

<div class="customer-section">
    <div class="customer-card">
        <h2 id="customer-section-heading"></h2>
        <div id="customer-details" class="customer-detail-grid"></div>
    </div>
</div>

<div class="app-shell">
    <div class="sidebar">
        <nav>
            <a href="/profile">Customer Profile</a>
            <a id="post-transaction-link" href="#">Post Transaction</a>
            <a id="account-statement-link" href="#">Account Statement</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="card">
            <h1>Post Transaction</h1>
            <p class="subtitle" id="account-context">Loading account details…</p>

            <div id="message" class="message"></div>

            <form id="post-transaction-form">
                <div class="field">
                    <label for="tran_type">Transaction Type</label>
                    <select id="tran_type" name="tran_type" required>
                        <option value="ATM Deposit">ATM Deposit</option>
                        <option value="ATM Withdrawal">ATM Withdrawal</option>
                        <option value="ATM Fees">ATM Fees</option>
                        <option value="POS Purchase">POS Purchase</option>
                        <option value="Cash Back">Cash Back</option>
                        <option value="Credit Interest">Credit Interest</option>
                    </select>
                </div>

                <div class="field">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
                </div>

                <button type="submit" class="btn-primary">POST TRANSACTION</button>
            </form>

            <a id="back-to-account-link" href="/profile" class="back-link">Back to Account Details</a>
        </div>
    </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/post-transaction.js"></script>
</body>
</html>
