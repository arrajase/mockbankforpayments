<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockBank | Reset Password</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-public>
<div class="navbar">
    <div class="logo">Mock<span>Bank</span></div>
    <div class="nav-right">
        <span id="greeting"></span>
        <button id="logout-btn" class="link-btn">Logout</button>
    </div>
</div>

<div class="customer-section">
    <div class="customer-card">
        <h2 id="customer-section-heading"></h2>
        <div id="customer-details" class="customer-detail-grid"></div>
    </div>
</div>

<div class="app-shell">
    <div class="sidebar">
        <nav>
            <a href="/profile">Customer Profile</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="card">
            <h1>Reset Password</h1>
            <p class="subtitle" id="reset-subtitle">Choose a new password for net banking. Your other signed-in sessions will be signed out.</p>

            <div id="message" class="message"></div>

            <form id="reset-password-form">
                <div class="field" id="login-id-field" hidden>
                    <label for="login_id">Login ID</label>
                    <input type="text" id="login_id" autocomplete="username">
                </div>
                <div class="field">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" required autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">RESET PASSWORD</button>
            </form>

            <a href="/profile" class="back-link" id="back-link">Back to My Accounts</a>
        </div>
    </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/reset-password.js"></script>
</body>
</html>
