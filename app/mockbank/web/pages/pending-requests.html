<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockBank | Pending Requests</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="navbar">
    <div class="logo">Mock<span>Bank</span></div>
    <div class="nav-right">
        <span id="greeting"></span>
        <button id="logout-btn" class="link-btn">Logout</button>
    </div>
</div>

<div class="customer-section">
    <div class="customer-card">
        <h2 id="customer-section-heading"></h2>
        <div id="customer-details" class="customer-detail-grid"></div>
    </div>
</div>

<div class="app-shell">
    <div class="sidebar">
        <nav>
            <a href="/profile">Customer Profile</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="statement-card">
            <h1>Pending Requests</h1>
            <p class="subtitle">Payment requests from apps, waiting for your approval</p>

            <div id="message" class="message"></div>

            <div id="request-list" class="request-list"></div>

            <a href="/profile" class="back-link">Back to My Accounts</a>
        </div>
    </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/pending-requests.js"></script>
</body>
</html>
